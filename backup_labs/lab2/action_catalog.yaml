# action_catalog.yaml
# Registry of autonomous remediation actions available to APO agents.
# Each action must pass all four confidence gates before execution.

actions:

  - action_id: pod.rolling_restart
    display_name: "Rolling Pod Restart"
    description: >
      Performs kubectl rollout restart on a Deployment.
      Pods are replaced one at a time (default RollingUpdate strategy),
      so the service stays available throughout the restart.
    risk_class: low
    blast_radius_max: 0.10        # fraction of pods affected at any moment
    reversal_command: "kubectl rollout undo deployment/{deployment} -n {namespace}"
    reversal_time_seconds: 120
    required_confidence: 0.80
    allowed_environments:
      - lab
      - staging
      - production
    symptom_classes:
      - MEMORY_PRESSURE
      - PROCESS_LEAK
    max_executions_per_hour: 3
    cooldown_seconds: 300

  - action_id: db.connection_reset
    display_name: "Database Connection Pool Reset"
    description: >
      Rolling restart of the target Deployment: pods are replaced one at a
      time and each new pod opens fresh database connections. The service
      stays available throughout (never scale to 0 — that is a full outage).
    risk_class: medium
    blast_radius_max: 0.10        # one pod at a time, same as pod.rolling_restart
    reversal_command: "kubectl rollout undo deployment/{deployment} -n {namespace}"
    reversal_time_seconds: 120
    required_confidence: 0.82
    allowed_environments:
      - lab
      - staging
    symptom_classes:
      - DB_BOTTLENECK
      - CONNECTION_EXHAUSTION
    max_executions_per_hour: 1
    cooldown_seconds: 600

  - action_id: config.rollback
    display_name: "Configuration Rollback"
    description: >
      Runs kubectl rollout undo to revert to the previous ReplicaSet.
      Fastest recovery path for bad deployments.
    risk_class: low
    blast_radius_max: 0.08
    reversal_command: "kubectl rollout undo deployment/{deployment} -n {namespace}"   # undoing the undo restores the newer revision
    reversal_time_seconds: 90
    required_confidence: 0.85
    allowed_environments:
      - lab
      - staging
      - production
    symptom_classes:
      - DEPLOYMENT_REGRESSION
    max_executions_per_hour: 2
    cooldown_seconds: 180

  - action_id: scale.horizontal_add
    display_name: "Horizontal Scale Out (+1 replica)"
    description: >
      Increases the Deployment replica count by 1. Useful for traffic spikes
      causing CPU/memory saturation. Does not reduce if traffic normalises;
      an operator or HPA handles scale-in.
    risk_class: low
    blast_radius_max: 0.0         # adds pods, doesn't remove any
    reversal_command: "kubectl scale deployment/{deployment} --replicas={original_replicas} -n {namespace}"
    reversal_time_seconds: 60
    required_confidence: 0.75
    allowed_environments:
      - lab
      - staging
      - production
    symptom_classes:
      - CAPACITY_EXHAUSTION
      - TRAFFIC_SPIKE
    max_executions_per_hour: 4
    cooldown_seconds: 120

  - action_id: circuit.reset
    display_name: "Circuit Breaker Reset"
    description: >
      Deletes and recreates the sidecar circuit-breaker ConfigMap, which
      forces the proxy to re-evaluate the open/closed state.
      Requires Istio or a compatible service mesh.
    risk_class: medium
    blast_radius_max: 0.05
    reversal_command: "kubectl apply -f backups/circuit-config-{deployment}.yaml -n {namespace}"
    reversal_time_seconds: 300
    required_confidence: 0.78
    allowed_environments:
      - lab
      - staging
    symptom_classes:
      - DEPENDENCY_FAILURE
      - UPSTREAM_TIMEOUT
    max_executions_per_hour: 2
    cooldown_seconds: 300

  - action_id: escalate_human
    display_name: "Escalate to Human Operator"
    description: >
      Sends a PagerDuty alert with the full diagnostic context and stands down
      automation. Used when no action has sufficient confidence or all relevant
      actions are blocked by safety gates.
    risk_class: none
    blast_radius_max: 0.0
    reversal_command: null
    reversal_time_seconds: 0
    required_confidence: 0.0      # always available as fallback
    allowed_environments:
      - lab
      - staging
      - production
    symptom_classes: []            # catch-all
    max_executions_per_hour: 99
    cooldown_seconds: 0
